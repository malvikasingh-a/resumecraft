{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ResumeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dashboard.css' %}">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="{% url 'home' %}">
                <i class="bi bi-file-earmark-text-fill"></i> ResumeCraft
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary small">Welcome, User</span>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">My Resumes</h2>
        </div>

        <div class="row g-4">
            <!-- Create New Card -->
            <div class="col-md-4 col-lg-3">
                <a href="{% url 'create_resume' %}" class="card h-100 text-decoration-none new-resume-card d-flex align-items-center justify-content-center p-5">
                    <div class="text-center">
                        <i class="bi bi-plus-circle-fill text-primary fs-1 mb-2"></i>
                        <h6 class="fw-bold text-dark m-0">Create New</h6>
                    </div>
                </a>
            </div>

            <!-- Existing Resume Card -->
            {% for resume in resumes %}
            <div class="col-md-4 col-lg-3">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="fw-bold text-truncate">{{ resume.title }}</h5>
                        
                        <p class="text-muted small mb-4">Last updated: {{ resume.updated_at|date:"M d, Y" }}</p>
                        
                        <div class="d-grid gap-2">
                            <a href="{% url 'editor' resume.id %}" class="btn btn-sm btn-primary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            
                            <a href="{% url 'delete_resume' resume.id %}" 
                               onclick="return confirm('Are you sure?');" 
                               class="btn btn-sm btn-link text-danger text-decoration-none">
                                Delete
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center py-5">
                <p class="text-muted">No resumes found. Click "Create New" to start!</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'dashboard.js' %}"></script>
</body>
</html>
