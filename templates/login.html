{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ResumeCraft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'auth.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm border-0 auth-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">
		<a href="{% url 'home' %}" style="text-decoration: none;">ResumeCraft</a></h3>
                <p class="text-secondary small">Welcome back! Please login.</p>
            </div>

            <form action="{% url 'login' %}" method="post">
                {% csrf_token %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger p-2 small" >
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="text" name="username" class="form-control" placeholder="Username or Email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="******" required>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">Log In</button>
                </div>
            </form>

            <div class="text-center small">
                <span class="text-muted">Don't have an account?</span>
                <a href="{% url 'signup' %}" class="text-decoration-none fw-bold">Sign Up</a>
            </div>
        </div>
    </div>

</body>
</html>
